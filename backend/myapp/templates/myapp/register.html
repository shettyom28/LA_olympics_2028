{% extends "myapp/base.html" %}

{% block content %}
<h1>Register</h1>

<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div>
        {{ form.username.errors }}
        <label for="id_username">Username:</label><br>
        <input type="text" name="username" id="id_username" maxlength="150" required>
    </div>
    <div>
        {{ form.email.errors }}
        <label for="id_email">Email:</label><br>
        <input type="email" name="email" id="id_email" required>
    </div>
    <div>
        {{ form.password.errors }}
        <label for="id_password">Password:</label><br>
        <input type="password" name="password" id="id_password" required>
    </div>
    <div>
        {{ form.confirm_password.errors }}
        <label for="id_confirm_password">Confirm password:</label><br>
        <input type="password" name="confirm_password" id="id_confirm_password" required>
    </div>
    <div>
        {{ form.interests.errors }}
        <label for="id_interests">Interests:</label><br>
        <textarea name="interests" id="id_interests"></textarea>
    </div>
    <button type="submit">Register</button>
</form>

<p>Already have an account? <a href="{% url 'myapp:login' %}">Login</a></p>
{% endblock %}
